function computeLabels(){

    if(d.x<0)d.x+=W;else if(d.x>W)d.x-=W;if(d.y<0)d.y+=H;else if(d.y>H)d.y-=H;
    const tk=0.5+0.5*Math.sin(d.tw),a=(d.base+d.amp*tk)*dShow,rr=d.r*(0.78+0.44*tk);
    ctx.beginPath();ctx.arc(d.x,d.y,rr,0,6.29);ctx.fillStyle=(d.g?'rgba(205,238,222,':'rgba(165,222,196,')+a+')';ctx.fill();}
  ctx.lineWidth=Math.max(.8,LR*0.0015);
  for(const L of links){const lp=clp((t-L.reveal)/900);if(lp<=0)continue;
    ctx.strokeStyle='rgba(120,210,165,'+(0.13*lp*Math.min(dimF(L.a),dimF(L.b)))+')';ctx.beginPath();ctx.moveTo(L.a.x,L.a.y);ctx.lineTo(L.b.x,L.b.y);ctx.stroke();}
  ctx.lineWidth=Math.max(1,LR*0.0024);
  for(const B of bridges){const lp=clp((t-B.reveal)/1000);if(lp<=0)continue;
    ctx.strokeStyle='rgba(244,205,118,'+(0.28*lp*dimF(B.a))+')';ctx.shadowColor='rgba(244,205,118,.4)';ctx.shadowBlur=LR*0.018;
    ctx.beginPath();ctx.moveTo(B.a.x,B.a.y);ctx.lineTo(B.b.x,B.b.y);ctx.stroke();ctx.shadowBlur=0;}
  for(const P of petals){const lp=clp((t-P.reveal)/1100);if(lp<=0)continue;
    ctx.lineWidth=P.outline?Math.max(1.4,LR*0.0032):Math.max(1,LR*0.0020);
    ctx.strokeStyle='rgba(247,212,124,'+((P.outline?0.6:0.32)*lp)+')';ctx.shadowColor='rgba(244,205,118,.5)';ctx.shadowBlur=LR*0.022;
    const ex=P.a.x+(P.b.x-P.a.x)*lp,ey=P.a.y+(P.b.y-P.a.y)*lp;ctx.beginPath();ctx.moveTo(P.a.x,P.a.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.shadowBlur=0;}
  let lit=0;
  for(const s of stars){s.tw+=0.028*s.twS;const ap=clp((t-s.revealAt)/700);
    if(t>=s.revealAt)lit++;if(ap<=0){s._sr=0;continue;}
    const df=dimF(s),tk=0.6+0.4*Math.sin(s.tw),isG=s.role==='gold';
    if(s.tail){const g=ctx.createLinearGradient(s.tail.tx,s.tail.ty,s.x,s.y);
      g.addColorStop(0,'rgba(150,230,200,0)');g.addColorStop(1,'rgba(170,240,210,'+(0.5*ap*tk*df)+')');
      ctx.strokeStyle=g;ctx.lineWidth=Math.max(1.5,LR*0.006);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.tail.tx,s.tail.ty);ctx.lineTo(s.x,s.y);ctx.stroke();}
    const r=isG?(s.r*ap*(1+0.05*Math.sin(t/700))):(s.r*(0.9+0.16*tk)*ap);
    ctx.globalAlpha=df;orb(s.x,s.y,r,ap,isG);
    if(isG)glint(s.x,s.y,r*3.0,0.5*ap);
    if(s.role==='edge'){ctx.globalAlpha=df;ctx.lineWidth=Math.max(1.4,LR*0.0038);ctx.strokeStyle='rgba(244,205,118,'+(0.9*ap*tk)+')';ctx.beginPath();ctx.arc(s.x,s.y,r*1.5,0,6.29);ctx.stroke();}
    ctx.globalAlpha=1;drawLabel(s,ap);s._sx=s.x;s._sy=s.y;s._sr=r;}
  elCnt.textContent=Math.min(lit,35);
  if(t>700){elTop.classList.add('show');elCntBox.classList.add('show');}
  if(t>5900)elLg.classList.add('show');
  requestAnimationFrame(frame);}
function pick(mx,my){mx*=DPR;my*=DPR;let best=null,bd=1e9;
  for(const s of stars){if(!s._sr)continue;if(goldOnly&&s.role!=='gold')continue;
    const d=Math.hypot(mx-s._sx,my-s._sy),hit=Math.max(s._sr*2.6,18*DPR);if(d<hit&&d<bd){bd=d;best=s;}}return best;}
function showTip(s){if(!s){tip.style.opacity='0';return;}const a=s.a;
  tip.classList.toggle('gold',s.role==='gold');
  tip.querySelector('.nm').textContent=a.name;
  tip.querySelector('.tg').textContent=a.tag+(a.city?(' · '+a.city):'');
  tip.querySelector('.mk').innerHTML='第 '+'1234'.split('').map(d=>'<i class="'+(a.mk.includes(d)?'on':'')+'">'+d+'</i>').join('·')+' 期';
  tip.style.left=(s._sx/DPR)+'px';tip.style.top=(s._sy/DPR)+'px';tip.style.opacity='1';}
cv.addEventListener('pointermove',e=>showTip(pick(e.clientX,e.clientY)));
cv.addEventListener('pointerleave',()=>tip.style.opacity='0');
cv.addEventListener('pointerdown',e=>showTip(pick(e.clientX,e.clientY)));
function replay(){t0=performance.now();elTop.classList.remove('show');elLg.classList.remove('show');elCntBox.classList.remove('show');tip.style.opacity='0';build();}
document.getElementById('bReplay').onclick=replay;
document.getElementById('bGold').onclick=function(){goldOnly=!goldOnly;this.classList.toggle('on',goldOnly);this.textContent=goldOnly?'显示全部':'只看金心';};
document.getElementById('bFull').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='r')replay();if(k==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}});
build();requestAnimationFrame(frame);
</script></body></html>
