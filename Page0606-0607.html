<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻页之夜 · 2026.06.07</title>
<style>
  :root{
    --gold-1:#f7dd95; --gold-2:#cf9f44; --gold-glow:rgba(244,205,118,.55);
    --green-1:#a5ead0; --green-2:#26a172; --green-glow:rgba(74,200,150,.45);
    --ink:#07090c; --ink-2:#0d1116;
    --serif:"Songti SC","STSong","思源宋体","Noto Serif SC",Georgia,"宋体",serif;
    --sans:"PingFang SC","思源黑体","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:#fff; font-family:var(--sans);
    overflow:hidden; cursor:default;
  }
  /* atmosphere */
  .bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(120% 90% at 50% 42%, #15191f 0%, #0a0d11 48%, #06080b 100%);
  }
  .bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(140% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.6) 100%);}
  #sparks{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .spark{position:absolute;border-radius:50%;opacity:0;
    filter:blur(.3px);
    animation:drift linear infinite;}
  @keyframes drift{
    0%{opacity:0;transform:translateY(14px) scale(.6)}
    14%{opacity:.9}
    80%{opacity:.55}
    100%{opacity:0;transform:translateY(-46px) scale(1)}
  }

  .stage{position:fixed;inset:0;z-index:2;display:grid;place-items:center;perspective:1700px}

  /* ---------- DATE SCENE ---------- */
  .dates{position:absolute;display:grid;place-items:center;text-align:center}
  .dline{display:grid;place-items:center;gap:.55rem}
  .num{
    font-family:var(--serif); font-weight:600;
    font-size:clamp(2.6rem,9vw,7.2rem); letter-spacing:.04em; line-height:1;
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .label{font-family:var(--sans);font-weight:300;letter-spacing:.9em;
    font-size:clamp(.7rem,1.8vw,1.05rem);text-indent:.9em;opacity:.0}
  .day6 .num{background-image:linear-gradient(180deg,var(--gold-1),var(--gold-2));
    text-shadow:0 0 38px var(--gold-glow);}
  .day6 .label{color:#e9c878}
  .day7 .num{background-image:linear-gradient(180deg,var(--green-1),var(--green-2));
    text-shadow:0 0 40px var(--green-glow);}
  .day7 .label{color:#7fd9b1}

  .day6{opacity:0;transform:translateY(10px) scale(.96)}
  .day6.in{animation:d6in 1.5s cubic-bezier(.2,.7,.2,1) forwards}
  .day6.up{animation:d6up 1.4s cubic-bezier(.5,0,.2,1) forwards}
  @keyframes d6in{to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes d6up{
    from{opacity:1;transform:translateY(0) scale(1)}
    to{opacity:.18;transform:translateY(-15vh) scale(.62)}
  }
  .day6.in .label{animation:lbl 1.4s .5s forwards}
  @keyframes lbl{to{opacity:.85}}

  .arrow{position:absolute;top:50%;transform:translateY(-50%);opacity:0}
  .arrow svg{width:34px;height:120px;display:block}
  .arrow path{stroke:#cdd6dd;stroke-width:2.2;fill:none;stroke-linecap:round;
    stroke-dasharray:160;stroke-dashoffset:160;filter:drop-shadow(0 0 6px rgba(200,220,230,.4))}
  .arrow.in{animation:arShow .5s forwards}
  .arrow.in path{animation:arDraw 1.1s .1s cubic-bezier(.6,0,.3,1) forwards}
  @keyframes arShow{to{opacity:.9}}
  @keyframes arDraw{to{stroke-dashoffset:0}}

  .day7{opacity:0;transform:translateY(16vh) scale(.96)}
  .day7.in{animation:d7in 1.7s cubic-bezier(.16,.8,.2,1) forwards}
  @keyframes d7in{to{opacity:1;transform:translateY(8vh) scale(1)}}
  .day7.in .label{animation:lbl 1.4s .6s forwards}

  .dates.out{animation:fade 1s forwards}
  @keyframes fade{to{opacity:0;filter:blur(4px)}}

  /* ---------- BOOK SCENE ---------- */
  .book-float{position:absolute;opacity:0;
    width:clamp(190px,26vw,340px);
    animation:bob 5.5s ease-in-out infinite}
  .book-float.in{opacity:1;transition:opacity 1.4s ease}
  .book-float.out{opacity:0;transition:opacity 1.3s ease;filter:blur(3px)}
  @keyframes bob{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}

  .book{position:relative;width:100%;aspect-ratio:796/1143;
    transform-style:preserve-3d;transform:rotateY(0)}
  .book.flip{animation:flip 3s cubic-bezier(.62,0,.34,1) forwards}
  @keyframes flip{to{transform:rotateY(180deg)}}

  .face{position:absolute;inset:0;backface-visibility:hidden}
  .face img{width:100%;height:100%;object-fit:contain;display:block;
    filter:drop-shadow(0 26px 40px rgba(0,0,0,.6)) drop-shadow(0 8px 16px rgba(0,0,0,.5))}
  .front{transform:rotateY(0deg)}
  .back{transform:rotateY(180deg)}
  /* white sheen clipped to the book silhouette, sweeps across during the flip */
  .sheen{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.7) 50%,transparent 58%);
    background-size:240% 100%;background-repeat:no-repeat;background-position:155% 0;
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-position:center;mask-position:center;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
  .book.flip .front .sheen{animation:sweep 3s cubic-bezier(.62,0,.34,1) forwards}
  @keyframes sweep{0%{opacity:1;background-position:155% 0}100%{opacity:1;background-position:-65% 0}}

  .glow{position:absolute;left:50%;top:54%;width:120%;height:64%;
    transform:translate(-50%,-50%);z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,rgba(244,205,118,.22),transparent 72%);
    filter:blur(14px);opacity:0;transition:background 2.6s ease, opacity 1.2s ease}
  .book-float.in .glow{opacity:1}
  .book-float.green .glow{background:radial-gradient(closest-side,rgba(74,200,150,.22),transparent 72%)}

  /* ---------- ENDING TITLE ---------- */
  .ending{position:absolute;text-align:center;opacity:0;display:grid;gap:1.5rem;place-items:center}
  .ending.in{animation:endIn 1.3s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes endIn{to{opacity:1}}
  .title{font-family:var(--serif);font-weight:600;
    font-size:clamp(3.2rem,12vw,9rem);letter-spacing:.18em;text-indent:.18em;
    background-image:linear-gradient(100deg,var(--gold-1) 0%,#f0e7c8 38%,var(--green-1) 70%,var(--green-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 50px rgba(180,200,170,.18);
    opacity:0;transform:translateY(14px)}
  .ending.in .title{animation:rise 1.2s .05s cubic-bezier(.2,.7,.2,1) forwards}
  .rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),var(--green-2),transparent);
    margin:.2rem auto}
  .ending.in .rule{animation:grow 1.2s .5s ease forwards}
  @keyframes grow{to{width:min(60vw,520px)}}
  .ed-date{font-family:var(--serif);font-size:clamp(1.1rem,3.2vw,1.9rem);
    letter-spacing:.42em;text-indent:.42em;color:#e7dcc2;opacity:0;transform:translateY(10px)}
  .ending.in .ed-date{animation:rise 1.1s .75s cubic-bezier(.2,.7,.2,1) forwards}
  .ed-sub{font-family:var(--sans);font-weight:300;
    font-size:clamp(.85rem,2.4vw,1.25rem);letter-spacing:.5em;text-indent:.5em;
    color:#b9c3bc;opacity:0;transform:translateY(10px)}
  .ed-sub b{font-weight:500;color:#f0d894}
  .ed-sub i{font-style:normal;font-weight:500;color:#86dcb5}
  .ending.in .ed-sub{animation:rise 1.1s 1.05s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  /* hint */
  .hint{position:fixed;right:22px;bottom:18px;z-index:5;
    font-family:var(--sans);font-weight:300;font-size:.74rem;letter-spacing:.25em;
    color:rgba(255,255,255,.32);transition:opacity .6s ease}
  .hint b{color:rgba(255,255,255,.6);font-weight:500}
</style>
</head>

    <div class="ending" id="ending">
      <div class="title">翻 · 页</div>
      <div class="rule"></div>
      <div class="ed-date">2026 · 06 · 07</div>
      <div class="ed-sub"><b>3 期结营</b> &nbsp;·&nbsp; <i>4 期开营</i></div>
    </div>
  </div>

  <div class="hint" id="hint"><b>R</b> 重播 &nbsp;·&nbsp; <b>F</b> 全屏</div>

<script>
  // ---- atmosphere particles ----
  const sparks = document.getElementById('sparks');
  function buildSparks(){
    sparks.innerHTML='';
    for(let i=0;i<46;i++){
      const s=document.createElement('div');s.className='spark';
      const size=Math.random()*2.4+1.1;
      const warm=Math.random()>.28;
      s.style.width=s.style.height=size+'px';
      s.style.left=Math.random()*100+'vw';
      s.style.top=Math.random()*100+'vh';
      s.style.background=warm?'rgba(245,212,140,.9)':'rgba(150,225,190,.85)';
      s.style.boxShadow=`0 0 ${size*3}px ${warm?'rgba(244,205,118,.6)':'rgba(110,220,170,.55)'}`;
      s.style.animationDuration=(Math.random()*5+5)+'s';
      s.style.animationDelay=(-Math.random()*9)+'s';
      sparks.appendChild(s);
    }
  }
  buildSparks();

  const day6=document.getElementById('day6'),
        day7=document.getElementById('day7'),
        arrow=document.getElementById('arrow'),
        dates=document.getElementById('dates'),
        bookfloat=document.getElementById('bookfloat'),
        book=document.getElementById('book'),
        ending=document.getElementById('ending'),
        hint=document.getElementById('hint');

  let timers=[];
  const T=(ms,fn)=>timers.push(setTimeout(fn,ms));

  function reset(){
    timers.forEach(clearTimeout);timers=[];
    [day6,day7,arrow].forEach(e=>e.className=e.id==='day6'?'dline day6':e.id==='day7'?'dline day7':'arrow');
    dates.className='dates';dates.style.opacity='';
    bookfloat.className='book-float';
    book.className='book';
    ending.className='ending';
    hint.style.opacity='0';
    void dates.offsetWidth;
  }

  function play(){
    reset();
    // DATE SCENE
    T(800,  ()=>day6.classList.add('in'));
    T(3000, ()=>day6.classList.add('up'));
    T(3300, ()=>arrow.classList.add('in'));
    T(4000, ()=>day7.classList.add('in'));
    T(6500, ()=>dates.classList.add('out'));
    // BOOK SCENE
    T(7500, ()=>bookfloat.classList.add('in'));
    T(10500,()=>book.classList.add('flip'));
    T(13500,()=>bookfloat.classList.add('green'));   // glow shifts to green
    T(15000,()=>bookfloat.classList.add('out'));
    // ENDING
    T(16000,()=>{ending.classList.add('in');});
    T(17800,()=>{hint.style.opacity='1';});
  }

  // controls
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='r'){play();}
    if(k==='f'){
      if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
      else{document.exitFullscreen&&document.exitFullscreen();}
    }
  });
  addEventListener('click',()=>{ /* tap anywhere to replay on touch screens */ play();});

  play();
</script>
